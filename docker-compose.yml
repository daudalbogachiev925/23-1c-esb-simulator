version: "3.9"
services:
  rabbitmq:
    image: rabbitmq:3-management
    ports: ["5672:5672", "15672:15672"]
    environment:
      RABBITMQ_DEFAULT_USER: esb
      RABBITMQ_DEFAULT_PASS: esb

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: esb
      POSTGRES_PASSWORD: esb
      POSTGRES_DB: esb
    ports: ["5432:5432"]
